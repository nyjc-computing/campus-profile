{% extends "base.html" %}
{% block title %}Profile — Campus Profile{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm" style="max-width: 32rem;">
        <div class="card-body">
            <div class="d-flex align-items-center mb-3">
                <i class="bi bi-person-circle display-5 me-3"></i>
                <div>
                    <h2 class="h4 mb-0">{{ user.name }}</h2>
                    <p class="text-muted mb-0">{{ user.email }}</p>
                </div>
            </div>
            <p class="text-muted small mb-0">
                Member since {{ user.created_at | timestamp }}
            </p>
        </div>
    </div>

    <div class="mt-3 d-flex gap-2">
        <a class="btn btn-outline-primary" href="{{ url_for('get_integrations_page') }}">
            <i class="bi bi-plug me-1"></i>Your integrations
        </a>
        <a class="btn btn-outline-primary" href="{{ url_for('events.get_events_page') }}">
            <i class="bi bi-calendar-event me-1"></i>My events
        </a>
    </div>
</div>
{% endblock %}
