{% extends "base.html" %}
{% block title %}Integrations — Campus Profile{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="h3 mb-3">Your integrations</h1>

    <div class="integration-grid">
        {% for connection in connections %}
        <div class="card integration-card">
            <div class="card-body d-flex align-items-center gap-2 p-2 px-3">
                <i class="bi {{ connection.icon }} fs-4"></i>
                <span class="text-truncate">{{ connection.title }}</span>
                <span class="badge {{ connection.badge }} ms-auto flex-shrink-0">{{ connection.label }}</span>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
