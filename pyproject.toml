[tool.poetry]
name = "campus-profile"
version = "0.1.0"
description = "Campus Profile"
authors = ["Matthew Na <na.hou.boon.matthew_2025@nyjc.edu.sg>"]

[tool.poetry.dependencies]
# Security tier (3.11-3.13): officially supported and CI-required.
# 3.14 (bugfix tier) is not yet supported here.
python = ">=3.11.0,<3.14"

# Client library dependencies (minimal for HTTP requests)
flask = "^3.0.0"
campus-suite = {git = "https://github.com/nyjc-computing/campus.git", branch = "weekly"}
campus-api-python = {git = "https://github.com/nyjc-computing/campus-api-python.git", branch = "main"}

# Deployment orchestration dependencies (all services) - required for deployment
gunicorn = "^26.2.0"
werkzeug = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pylint = "^3.0"

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# ARG omitted: unused-argument flags Campus's signature-contract pattern
# (route handlers bound by unpack_request, interface-conform resource
# methods) repo-wide; revisit if the routing layer changes.
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'SIM']
# Policy (from the campus repo, 2026-09-30): ruff enforces style; humans
# rewrite code. Autofixes are disabled repo-wide because they are
# semantics-preserving only for common types. Use `ruff check --diff` to
# review suggested rewrites, then apply them deliberately per site.
fixable = []

[tool.ruff.lint.per-file-ignores]
# test_smoke.py sets the Campus env defaults before importing
# campus_python, which reads CLIENT_ID/CLIENT_SECRET at import time.
"tests/test_smoke.py" = ["E402"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
